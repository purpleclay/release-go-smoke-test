name: ci
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: jq -e '.contents.packages | length > 0' .github/container/apko.lock.json
