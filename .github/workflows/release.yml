name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
      actions: read # list this run's artifacts to resolve their immutable ids
    # TEMPORARY: pointed at the branch under test (purpleclay/release-workflows#52,
    # removing the literal ${{ github.ref_name }} expression from the ldflags
    # description that broke every caller) rather than a pinned SHA, so any
    # further fixes needed on this branch are picked up automatically. Revert
    # to a pinned SHA if this repo is kept.
    uses: purpleclay/release-workflows/.github/workflows/release-go.yml@52-remove-literal-from-description
    with:
      bin: nsv
      targets: '["linux/amd64","linux/arm64","darwin/amd64","darwin/arm64","windows/amd64","windows/arm64"]'
      cgo: false
      ldflags: "-s -w -X main.version=${{ github.ref_name }}"
