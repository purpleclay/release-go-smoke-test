name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
      actions: read # list this run's artifacts to resolve their immutable ids
    # TEMPORARY: pointed at the branch under test (purpleclay/release-workflows#61,
    # per-binary SBOM generation + attestation) rather than a pinned SHA, so
    # any further fixes needed on this branch are picked up automatically.
    # Revert to a pinned SHA if this repo is kept.
    uses: purpleclay/release-workflows/.github/workflows/release-go.yml@61-go-sboms
    with:
      bin: nsv
      # cgo: true drops windows/* support (no reviewed mingw path) and moves
      # linux/arm64 and darwin/* to native-toolchain runners
      # (ubuntu-24.04-arm, macos-15) instead of cross-compiling from
      # ubuntu-24.04 — exercising those runners for harden_runner insights.
      targets: '["linux/amd64","linux/arm64","darwin/amd64","darwin/arm64"]'
      cgo: true
      ldflags: "-s -w -X main.version=${{ github.ref_name }}"
