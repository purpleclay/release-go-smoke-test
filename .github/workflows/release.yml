name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
      actions: read # list this run's artifacts to resolve their immutable ids
    # TEMPORARY: pointed at a spike branch (purpleclay/release-workflows#63,
    # 63-audit-spike) with build's harden_runner back to audit, to capture
    # real egress for an uncached go-version + fresh module verification.
    # Not a real config, revert once the spike is done.
    uses: purpleclay/release-workflows/.github/workflows/release-go.yml@63-audit-spike
    with:
      bin: nsv
      # Deliberately not the version resolved from nsv's go.mod (1.23.4).
      # Newer than go.mod's minimum (so GOTOOLCHAIN=local doesn't reject it
      # on a version mismatch), but a specific old patch unlikely to be the
      # exact one pre-cached on the runner image, to force setup-go's real
      # download path rather than a cache hit.
      go-version: "1.24.0"
      # cgo: true drops windows/* support (no reviewed mingw path) and moves
      # linux/arm64 and darwin/* to native-toolchain runners
      # (ubuntu-24.04-arm, macos-15) instead of cross-compiling from
      # ubuntu-24.04 — exercising those runners for harden_runner insights.
      targets: '["linux/amd64","linux/arm64","darwin/amd64","darwin/arm64"]'
      cgo: true
      ldflags: "-s -w -X main.version=${{ github.ref_name }}"
